name: Frontend Tests

# NOTE: Path filters on pull_request mean this check is absent (not skipped) on backend-only PRs.
# This is intentional and safe — backend-only changes don't need frontend tests to run.
# If this workflow is ever added as a required status check in branch protection,
# the absence won't block merge because GitHub doesn't require checks that don't run.
# See TODO.md T4 for context.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
