name: Frontend Tests

# Called by checks.yml when frontend/** changes (Q49); checks.yml's
# `required-checks` is what branch protection requires, so a backend-only PR
# is not left waiting for this status (the old T4 note). The type check moved
# to lint.yml (Q47), the cheapest job, so a type error fails there first.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-only-secret-not-for-deployment
          # A production build refuses to guess its API origin (round 7);
          # this build is never run, so any well-formed origin will do.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
