name: Backend Tests

# Called by checks.yml when backend/** changes (Q49). The suite runs with
# pytest-xdist, one worker per CPU, each on its own database created and
# dropped by tests/conftest.py (Q48).

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres is started as a step, not a `services:` block, so it can be
    # launched with durability off (Q57): a throwaway CI database never needs
    # to survive a crash, and skipping fsync/WAL sync is a large win when
    # every test commits. `services:` cannot override the container command,
    # which is the only way to pass `-c fsync=off` et al. The host job reaches
    # it on localhost:5432 exactly as before.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres (durability off — throwaway test database)
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=spacerental \
            -e POSTGRES_PASSWORD=spacerental \
            -e POSTGRES_DB=spacerental_test \
            -p 5432:5432 \
            postgres:18-alpine \
            postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U spacerental && exit 0
            sleep 1
          done
          echo "::error::Postgres did not become ready in 30 s" >&2
          docker logs postgres
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@localhost:5432/spacerental_test
          SECRET_KEY: test-secret-key-32-chars-min-test-test
        # --durations here, not in pytest.ini, so local runs stay quiet (Q57).
        run: pytest -n 8 --durations=20
