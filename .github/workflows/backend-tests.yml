name: Backend Tests

# Called by checks.yml when backend/** changes (Q49). The suite runs with
# pytest-xdist, one worker per CPU, each on its own database created and
# dropped by tests/conftest.py (Q48).

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spacerental
          POSTGRES_PASSWORD: spacerental
          POSTGRES_DB: spacerental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacerental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@localhost:5432/spacerental_test
          SECRET_KEY: test-secret-key-32-chars-min-test-test
        run: pytest -n auto
