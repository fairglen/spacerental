name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spacerental
          POSTGRES_PASSWORD: spacerental
          POSTGRES_DB: spacerental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacerental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@localhost:5432/spacerental_test
          SECRET_KEY: test-secret-key-32-chars-min-test-test
        run: pytest
