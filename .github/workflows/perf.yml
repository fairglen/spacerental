name: Performance

# Called by checks.yml (P2.4) — informational: neither job is in
# `required-checks` yet, so a budget miss shows up red on the PR without
# blocking it. Promote them once they have been stable for a while.
#
# perf-api: `pytest -m perf` — the three key reads on a 10 000-booking
#   organisation; asserts the row sizes, statement counts, writes and plans
#   pinned in backend/tests/perf/test_read_paths.py.
# perf-web: the Playwright `perf` project against the e2e stack (production
#   build, same images as the e2e job through the Actions layer cache);
#   asserts frontend/perf-budget.json and uploads the measurements.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RECURRING_BOOKINGS_ENABLED: 'true'

jobs:
  perf-api:
    name: perf-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: spacerental
          POSTGRES_PASSWORD: spacerental
          POSTGRES_DB: spacerental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacerental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Measure the key reads
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@localhost:5432/spacerental_test
          SECRET_KEY: test-secret-key-32-chars-min-test-test
        run: pytest -m perf -s
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-api
          path: backend/perf-results/
          retention-days: 14

  perf-web:
    name: perf-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env
        run: cp .env.example .env
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install the test runner
        working-directory: frontend
        run: npm ci
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install the browser's system packages
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the stack images (the e2e job's layer cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          load: true
          set: |
            backend.cache-from=type=gha,scope=e2e-backend
            frontend.cache-from=type=gha,scope=e2e-frontend
      - name: Start the e2e stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --no-build
      - name: Wait for the backend and the frontend (60 s cap each)
        run: |
          set -euo pipefail
          wait_for() {
            for _ in $(seq 1 30); do
              if curl -sf "$1" > /dev/null; then echo "$2 is up"; return 0; fi
              sleep 2
            done
            echo "::error::$2 did not come up within 60 s" >&2
            return 1
          }
          wait_for http://localhost:8000/health backend
          wait_for http://localhost:3000/api/auth/providers frontend
      - name: Seed
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T backend python -m app.seed

      - name: Measure the pages (median of 3 cold loads each, budgets in perf-budget.json)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000/api/v1
        run: npm run perf:web
      - name: Bundle sizes
        if: always()
        working-directory: frontend
        # The production build's manifests, as the image carries them.
        run: |
          set -euo pipefail
          cid=$(docker compose -f ../docker-compose.yml -f ../docker-compose.e2e.yml ps -q frontend)
          docker cp "$cid:/app/.next" ./.next-image
          NEXT_DIR=./.next-image npm run perf:sizes
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-web
          path: frontend/perf-results/
          retention-days: 14
      - name: Capture stack diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > stack.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-web-diagnostics
          path: |
            frontend/test-results/
            stack.log
          retention-days: 7
