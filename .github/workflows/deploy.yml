name: Deploy

# E05: GitHub is the deployer, inert until the owner sets the repository
# variable DEPLOY_ENABLED=true (docs/runbooks/aws.md, Phase 2.6).
#
# Runs after a green `Checks` on main (every merge), or by hand with a
# commit to deploy — the rollback path: Run workflow with the previous sha.
# Builds the two linux/arm64 images on an arm64 runner (native, no
# emulation), pushes them to ECR as sha-<7> and main, ships this commit's
# deploy/ files and Compose files to the backups bucket, and runs the
# `spacerental-deploy` SSM document (= /srv/spacerental/deploy.sh <sha>) on
# the instance tagged Name=spacerental-prod; ends with an HTTPS probe.
#
# DECISION (E10, revising E05): the deploy job runs in the GitHub
# environment `production-app`, and the deploy role trusts that subject
# only — not the branch, so no other workflow on main can assume it. The
# owner creates the environment WITHOUT reviewers (runbook 2.2), which keeps
# deploys continuous; adding a required reviewer there is the one switch
# that makes every deploy wait for a click (runbook, Phase 5). The role may
# send that one document and nothing else: it says "deploy this sha", it
# cannot run a shell.

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (default: the tip of main). An older sha is a rollback.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

# Deploys queue; a running one is never cancelled half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  disabled:
    name: disabled
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::deploy disabled - set repository variable DEPLOY_ENABLED=true to build, push and deploy after a green Checks on main (docs/runbooks/aws.md, Phase 2.6)"

  deploy:
    name: build, push, deploy
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    # DECISION: a hosted arm64 runner (free for public repositories) builds
    # the arm64 images natively; QEMU emulation of `next build` would take
    # many times longer and is the fallback if the repository turns private.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    # The deploy role's only trusted subject (E10). No reviewers by default.
    environment: production-app
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          # The whole history: the ancestry check below needs it.
          fetch-depth: 0
      - name: The commit to deploy
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "deploying $sha"
      - name: The commit must be on main (E16)
        # Run workflow accepts any sha the repository holds — a branch, a
        # closed pull request. Only what main contains may reach production;
        # on every other path this is a tautology and costs one fetch.
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is on main"
          else
            echo "::error::$SHA is not on main — a deploy ships only commits that main contains (E16)"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/spacerental-gh-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        id: ecr
        run: |
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the backend (linux/arm64)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/spacerental/backend
        run: |
          docker buildx build backend --platform linux/arm64 --target runtime --provenance=false \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            -t "$IMAGE:sha-${{ steps.sha.outputs.short }}" -t "$IMAGE:main" --push
      - name: Build and push the frontend (linux/arm64)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/spacerental/frontend
        # NEXT_PUBLIC_* values are inlined at build time (frontend/Dockerfile):
        # the relative API URL through the /backend proxy, the commit as the
        # version the help form reports; the product defaults for the rest.
        run: |
          docker buildx build frontend --platform linux/arm64 --target runner --provenance=false \
            --build-arg NEXT_PUBLIC_API_URL=/backend/api/v1 \
            --build-arg INTERNAL_API_URL=http://backend:8000/api/v1 \
            --build-arg "NEXT_PUBLIC_APP_VERSION=sha-${{ steps.sha.outputs.short }}" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            -t "$IMAGE:sha-${{ steps.sha.outputs.short }}" -t "$IMAGE:main" --push
      - name: Ship this commit's deploy files to the bucket
        env:
          BUCKET: spacerental-backups-${{ vars.AWS_ACCOUNT_ID }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          aws s3 cp --only-show-errors docker-compose.prod.yml "s3://$BUCKET/deploy/$SHA/docker-compose.prod.yml"
          aws s3 cp --only-show-errors docker-compose.prod.awslogs.yml "s3://$BUCKET/deploy/$SHA/docker-compose.prod.awslogs.yml"
          aws s3 cp --only-show-errors --recursive deploy/ "s3://$BUCKET/deploy/$SHA/deploy/"
      - name: Find the instance
        id: instance
        run: |
          id=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=spacerental-prod Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = None ]; then
            echo "::notice::no running instance tagged Name=spacerental-prod — images pushed, nothing deployed (apply infra/prod first)"
            echo "id=" >> "$GITHUB_OUTPUT"
          else
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "instance $id"
          fi
      - name: deploy.sh on the instance (the spacerental-deploy SSM document)
        if: steps.instance.outputs.id != ''
        env:
          INSTANCE: ${{ steps.instance.outputs.id }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name spacerental-deploy \
            --comment "deploy $SHA" \
            --timeout-seconds 600 \
            --parameters "sha=$SHA" \
            --query Command.CommandId --output text)
          echo "command $command_id"
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" \
              --query Status --output text 2> /dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          echo "status: $status"
          output=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text)
          printf '%s\n' "$output"
          # E14: deploy.sh rolled the host back to the previous release; the
          # job stays red, the summary says what is serving.
          if rolled=$(grep -m1 '^rolled back to ' <<< "$output"); then
            echo "::warning::$SHA was not healthy — the host $rolled"
            printf '### Deploy of %s failed — the host %s\n\nThe previous release is serving; deploy.sh left the schema as it is (migrations are forward-compatible by rule, CLAUDE.md §6.5).\n' "$SHA" "$rolled" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$status" = Success ] || { echo "::error::deploy.sh ended with status $status"; exit 1; }
      - name: Probe the site
        if: steps.instance.outputs.id != ''
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/backend/health"; then echo; echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::https://${{ vars.APP_DOMAIN }}/backend/health did not answer 200 within 60 s"
          exit 1
