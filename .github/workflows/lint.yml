name: Lint

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned deliberately: an unpinned `pip install ruff` picked up 0.16.1,
      # whose widened default rules failed CI on untouched code. Bump this
      # intentionally, together with ruff.toml and .pre-commit-config.yaml.
      - run: pip install ruff==0.15.17
      - run: ruff check backend/app backend/tests
