name: Lint

# Path-filtered like the backend-tests, frontend-tests and migrations
# workflows: `ruff check backend` only has an opinion about backend Python, so
# an unfiltered run made unrelated branches (e.g. a static-site-only change)
# inherit and report main's lint state as their own failure. `ruff.toml` lives
# at the repository root, so it has to be listed alongside `backend/**` or a
# config change would skip its own check; `.pre-commit-config.yaml` pins the
# same Ruff version as this file, so a hook bump must run this check too.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned deliberately: an unpinned `pip install ruff` picked up 0.16.1,
      # whose widened default rules failed CI on untouched code. Bump this
      # intentionally, together with ruff.toml and .pre-commit-config.yaml.
      - run: pip install ruff==0.16.5
      - run: ruff check backend
