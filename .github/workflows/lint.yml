name: Lint

# Called by checks.yml when backend or frontend files change (Q47/Q49). Two
# jobs, both cheap: Ruff (check + format) for the backend, and ESLint plus
# the TypeScript type check for the frontend — the type check lives here
# rather than in frontend-tests so a type error fails in the cheapest job.
# `ruff.toml` lives at the repository root; `.pre-commit-config.yaml` pins
# the same Ruff version as this file, so a hook bump must run this check too.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Pinned deliberately: an unpinned `pip install ruff` picked up 0.16.1,
      # whose widened default rules failed CI on untouched code. Bump this
      # intentionally, together with ruff.toml and .pre-commit-config.yaml.
      - run: pip install ruff==0.16.5
      - run: ruff check backend
      - run: ruff format --check backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      # What `next build` lints, made explicit (and run on the tests too).
      - run: npx eslint . --ext .ts,.tsx,.js,.mjs
      - run: npx tsc --noEmit
