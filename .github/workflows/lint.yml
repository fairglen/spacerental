name: Lint

# Called by checks.yml when backend or frontend files change (Q47/Q49). Three
# jobs, all cheap: Ruff (check + format) for the backend, ESLint plus the
# TypeScript type check for the frontend — the type check lives here rather
# than in frontend-tests so a type error fails in the cheapest job — and the
# Compose render check for the layered remote-access env file (D19).
# `ruff.toml` lives at the repository root; `.pre-commit-config.yaml` pins
# the same Ruff version as this file, so a hook bump must run this check too.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Pinned deliberately: an unpinned `pip install ruff` picked up 0.16.1,
      # whose widened default rules failed CI on untouched code. Bump this
      # intentionally, together with ruff.toml and .pre-commit-config.yaml.
      - run: pip install ruff==0.16.5
      - run: ruff check backend
      - run: ruff format --check backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      # What `next build` lints, made explicit (and run on the tests too).
      - run: npx eslint . --ext .ts,.tsx,.js,.mjs
      - run: npx tsc --noEmit

  compose:
    # D19: with only .env the rendered Compose environment is today's
    # localhost one; with .env.remote layered on it every browser-facing
    # value follows WEB/API and INTERNAL_API_URL does not; the script's
    # --dry-run prints a working layer. Runs in a scratch copy; needs the
    # runner's Docker Compose (v2.24+ for several --env-file flags) and jq.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/tests/remote-env.sh

  deploy:
    # E08: the host-side scripts and the workflows — shellcheck on every
    # shell script, actionlint on every workflow (it runs shellcheck on the
    # `run:` steps too), the cloud-init schema on deploy/cloud-init.yaml (the
    # runner's own cloud-init package), and deploy.sh's dry run, which prints
    # every command and runs none. The two linters run from their images,
    # pinned by digest like every other image here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          # koalaman/shellcheck v0.11.0
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x deploy/*.sh scripts/*.sh scripts/tests/*.sh backend/docker-entrypoint.sh
      - name: actionlint
        run: |
          # rhysd/actionlint 1.7.11
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color
      - name: cloud-init schema
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cloud-init > /dev/null
          cloud-init schema --config-file deploy/cloud-init.yaml --annotate
      - name: deploy.sh dry run
        run: |
          DEPLOY_DRY_RUN=1 DEPLOY_DIR=. BACKUP_BUCKET=example-bucket AWS_REGION=eu-west-1 \
            ECR_REGISTRY=123456789012.dkr.ecr.eu-west-1.amazonaws.com \
            deploy/deploy.sh 0123456789abcdef0123456789abcdef01234567
