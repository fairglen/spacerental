# Ruff configuration.
#
# The rule set is selected EXPLICITLY rather than relying on ruff's defaults.
# Defaults change between ruff releases: 0.16 widened them to include more
# linters. An explicit `select` makes the lint result depend on this file
# instead of on which ruff version happened to get installed.
#
# Keep this in sync with the pinned version in .github/workflows/lint.yml
# and the `rev` in .pre-commit-config.yaml.

target-version = "py312"
line-length = 100

[lint]
# Ruff 0.16's extended default set: pycodestyle, pyflakes, plus additional
# linters for code quality, imports, and modernization.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernization)
    "RUF",   # ruff-specific rules
    "FURB",  # refurb (suggested improvements)
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style (for test files)
    "BLE",   # flake8-blind-except
    "ISC",   # flake8-implicit-string-concatenation
    "PLC",   # pylint convention
    "PLE",   # pylint error
    "PLW",   # pylint warning
    "DTZ",   # flake8-datetimez
    "N",     # pep8-naming
]

[lint.per-file-ignores]
# Alembic migrations are generated; they often have long lines for SQL
# definitions and unused imports in the template preamble.
"backend/alembic/versions/*" = ["F401", "E501"]

# FastAPI uses Depends() and Query() in default arguments, which is the
# intended pattern. B008 false-positives here.
"backend/app/routers/*" = ["B008"]
"backend/app/auth.py" = ["B008"]
"backend/app/main.py" = ["B008"]

# Test files commonly have imports inside test functions for clarity and
# to keep dependencies explicit to each test. Pytest style rules are often
# subjective and over-constrain test readability.
"backend/tests/*" = ["PLC0415", "PT006", "PT011", "PT018", "RUF043"]
