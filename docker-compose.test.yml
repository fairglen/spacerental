services:
  test-db:
    # postgres:18-alpine, pinned by digest (Q53)
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: spacerental
      POSTGRES_PASSWORD: spacerental
      POSTGRES_DB: spacerental_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacerental -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@test-db:5432/spacerental_test
      SECRET_KEY: test-secret-key-32-chars-min-test-test
      # The seed tests copy the room illustrations (V01); the image holds only backend/.
      SEED_PHOTOS_DIR: /app/seed-photos
      # tests/test_bootstrap.py pins the bootstrap defaults to the site's facts (E03).
      BUSINESS_JSON: /app/business.json
    volumes:
      - ./flowspace-site/assets/img/room-photos:/app/seed-photos:ro
      - ./flowspace-site/assets/data/business.json:/app/business.json:ro
    depends_on:
      test-db:
        condition: service_healthy
    # One worker per CPU, each on its own database (tests/conftest.py, Q48).
    command: pytest -n auto -v
