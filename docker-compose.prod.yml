# The production stack (E01): Caddy in front, the two application images, no
# database — DATABASE_URL points at RDS. Nothing but Caddy publishes a port.
#
# On the host, deploy/deploy.sh runs it with the images for one commit:
#
#   BACKEND_IMAGE=…:sha-<7> FRONTEND_IMAGE=…:sha-<7> \
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.awslogs.yml up -d --remove-orphans
#
# Locally the same file builds the images in place, with a throwaway Postgres
# from the test overlay (scripts/tests/prod-stack.sh is the whole exercise):
#
#   docker compose -p spacerental-prod-local -f docker-compose.prod.yml \
#     -f scripts/tests/prod-stack.compose.yml up -d --build
#
# Every `${…}` here is read from `.env` next to this file — on the host the
# one deploy.sh writes from SSM Parameter Store; `.env.production.example`
# documents each variable. The backend gets the whole file (`env_file`): it
# is the backend's configuration, and app/config.py ignores what it does not
# know. The frontend gets only the variables named below, so SECRET_KEY, the
# Stripe and Resend keys never reach the Node process (DECISION, E01).

# One logging shape for the three services. The `awslogs` driver needs
# options (group, region, stream) that the default `json-file` driver
# rejects, so they cannot be conditional here: production adds
# docker-compose.prod.awslogs.yml with a second `-f`.
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}

services:
  caddy:
    # caddy:2, pinned by digest (Q53)
    image: caddy:2@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The site Caddy serves and gets a Let's Encrypt certificate for;
      # `localhost` makes it use its internal CA (`curl -k`) instead.
      CADDY_DOMAIN: "${CADDY_DOMAIN:?CADDY_DOMAIN is required — the site's domain, or localhost for a local run}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: lost = rate-limited re-issuance.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-spacerental-frontend:local}
    build:
      context: ./frontend
      # The production build (`next start`), as the e2e stack runs it (Q42).
      target: runner
      args:
        # Inlined into the browser bundle at build time (frontend/Dockerfile):
        # the relative API URL goes through the /backend proxy (D20).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend/api/v1}
        NEXT_PUBLIC_BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-30}
        NEXT_PUBLIC_CANCELLATION_CREDIT_VALIDITY_DAYS: ${CANCELLATION_CREDIT_VALIDITY_DAYS:-365}
        NEXT_PUBLIC_CONTACT_PHONE: ${CONTACT_PHONE:-}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      # lib/auth.ts refuses the development NEXTAUTH_SECRET under
      # `production` (E02); the dev and e2e stacks say `development`.
      APP_ENV: ${APP_ENV:-production}
      # The URL the browser reaches this frontend at — the session cookie is
      # bound to it, so it is the public https address.
      NEXTAUTH_URL: "${NEXTAUTH_URL:?NEXTAUTH_URL is required — the public https URL of the app}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — generate one with `openssl rand -base64 48`}"
      NEXT_PUBLIC_RECURRING_BOOKINGS_ENABLED: ${RECURRING_BOOKINGS_ENABLED:-false}
      NEXT_PUBLIC_BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-30}
      NEXT_PUBLIC_CANCELLATION_CREDIT_VALIDITY_DAYS: ${CANCELLATION_CREDIT_VALIDITY_DAYS:-365}
      NEXT_PUBLIC_CONTACT_PHONE: ${CONTACT_PHONE:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend/api/v1}
      # Where this container calls the API and where the /backend proxy
      # forwards (CLAUDE.md §6.3): the service name, deliberately not a
      # variable, as in docker-compose.yml.
      INTERNAL_API_URL: http://backend:8000/api/v1
      # One reverse proxy in front of Next (Caddy), so /api/csp-report's
      # limiter charges the address Caddy appended.
      CSP_REPORT_TRUSTED_PROXIES: ${CSP_REPORT_TRUSTED_PROXIES:-1}
      LANDING_CACHE_SECONDS: ${LANDING_CACHE_SECONDS:-0}
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "start"]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-spacerental-backend:local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    # The image's own CMD: `uvicorn --workers ${WEB_CONCURRENCY} --proxy-headers`
    # (backend/Dockerfile), after `alembic upgrade head` in the entrypoint.
    # Two workers for a t4g.small; the in-process rate limits are per worker
    # (Q55), so every limit is effectively doubled — documented in
    # .env.production.example.
    env_file: .env
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Photos and private invoice PDFs under MEDIA_STORAGE=local, on the
      # host's data volume (MEDIA_HOST_DIR=/srv/media in production); the
      # app's own name for it is fixed here so `.env` cannot point the API
      # at another path. Under MEDIA_STORAGE=s3 (E18) the mount is unused
      # and goes with the volume (E19).
      MEDIA_ROOT: /app/media
    volumes:
      - ${MEDIA_HOST_DIR:-./data/media}:/app/media
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
