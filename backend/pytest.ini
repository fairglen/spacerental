[pytest]
asyncio_mode = auto
# One event loop per session (per xdist worker): what the old session-scoped
# `event_loop` fixture gave the async fixtures and tests. pytest-asyncio 1.x
# dropped that fixture; the scope is configuration now (CLAUDE.md §6.1).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    perf: measurements on a 10 000-booking organisation (tests/perf, P1.1); deselected by default, run with `pytest -m perf`
# `-m` on the command line replaces this one, so `pytest -m perf` runs only the perf suite.
addopts = -v --tb=short -m "not perf"
