services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spacerental
      POSTGRES_PASSWORD: spacerental
      POSTGRES_DB: spacerental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacerental"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@db:5432/spacerental
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
      CUSTOMER_ENROLLMENT_ORG_SLUG: ${CUSTOMER_ENROLLMENT_ORG_SLUG-demo-space}
      CUSTOMER_ENROLLMENT_ENABLED: ${CUSTOMER_ENROLLMENT_ENABLED:-true}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      RECURRING_BOOKINGS_ENABLED: ${RECURRING_BOOKINGS_ENABLED:-false}
      CORS_ORIGINS: http://localhost:3000
      # ── Rate limiting (in-process, per client IP) ────────────────────────
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      RATE_LIMIT_PUBLIC_MAX_REQUESTS: ${RATE_LIMIT_PUBLIC_MAX_REQUESTS:-120}
      RATE_LIMIT_PUBLIC_WINDOW_SECONDS: ${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:-60}
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
      RATE_LIMIT_UPLOAD_MAX_REQUESTS: ${RATE_LIMIT_UPLOAD_MAX_REQUESTS:-30}
      RATE_LIMIT_UPLOAD_WINDOW_SECONDS: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:-60}
      # The public help form (C17): every accepted request emails a person.
      RATE_LIMIT_SUPPORT_MAX_REQUESTS: ${RATE_LIMIT_SUPPORT_MAX_REQUESTS:-5}
      RATE_LIMIT_SUPPORT_WINDOW_SECONDS: ${RATE_LIMIT_SUPPORT_WINDOW_SECONDS:-3600}
      # ── Room and space photos (C14) ──────────────────────────────────────
      # "local" is the only storage today: processed photos live in the `media`
      # volume below and the API serves them read-only at /media. Any other
      # value stops the backend at boot instead of silently writing locally.
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_ROOT: /var/lib/spacerental/media
      # Handed to the visitor's browser inside API responses, so localhost is
      # correct here (same reasoning as STRIPE_STUB_CHECKOUT_BASE_URL).
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8000/media}
      # Defaults mirror app/config.py so a fresh clone comes up in stub mode
      # with nothing set. The keys are forwarded empty rather than omitted:
      # app.payments.validate_payment_settings() treats empty as missing, so
      # STRIPE_MODE=live without keys still dies at boot instead of silently
      # running the stub.
      STRIPE_MODE: ${STRIPE_MODE:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      # Browser redirect targets, so localhost is correct here (CLAUDE.md §6.3
      # governs container-to-container calls, not URLs handed to the user).
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/dashboard?pagamento=sucesso}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/dashboard?pagamento=cancelado}
      # Stub mode only (T10): browser-facing base URL of this backend, used to
      # build the walkable /checkout/stub/{id} page's URL. Same reasoning as
      # STRIPE_SUCCESS_URL/CANCEL_URL above — handed to the browser, so
      # localhost is correct here even inside docker-compose.
      STRIPE_STUB_CHECKOUT_BASE_URL: ${STRIPE_STUB_CHECKOUT_BASE_URL:-http://localhost:8000}
      # Minutes an unpaid hourly booking holds its slot while on Checkout (C03).
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
      # Days ahead a customer may book (H01); operators have no horizon. The
      # frontend gets the same value below for the calendar's hint.
      BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-30}
      # Same stub/live shape as Stripe above: stub (default) just logs the
      # email and requires nothing; live calls Resend and RESEND_API_KEY
      # becomes mandatory — app.email.validate_email_settings() dies at boot
      # without it rather than silently running the stub.
      EMAIL_MODE: ${EMAIL_MODE:-stub}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # flowspace.pt must be verified at the email provider before live mode.
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-FlowSpace <no-reply@flowspace.pt>}
      # Where help-form requests go (C17); the public contact address (C09).
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-geral@flowspace.pt}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Local process-memory access codes. Live startup is gated until durable
      # identifiers and retry state ship (roadmap O04), even with credentials.
      SEAM_MODE: ${SEAM_MODE:-stub}
      SEAM_API_KEY: ${SEAM_API_KEY:-}
      SEAM_DEVICE_ID_MAP: ${SEAM_DEVICE_ID_MAP:-}
      SEAM_TIMEOUT_SECONDS: ${SEAM_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Outside the bind mount on purpose: uploads must not land in the checkout.
      - media:/var/lib/spacerental/media
    # The image's ENTRYPOINT runs `alembic upgrade head` before handing off to
    # this command, so a fresh clone still comes up with a working schema in one
    # step. The app itself never creates tables — see backend/app/database.py.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — copy .env.example to .env}
      NEXT_PUBLIC_RECURRING_BOOKINGS_ENABLED: ${RECURRING_BOOKINGS_ENABLED:-false}
      NEXT_PUBLIC_BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-30}
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  pgdata:
  media:
