services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spacerental
      POSTGRES_PASSWORD: spacerental
      POSTGRES_DB: spacerental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacerental"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://spacerental:spacerental@db:5432/spacerental
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      RECURRING_BOOKINGS_ENABLED: ${RECURRING_BOOKINGS_ENABLED:-false}
      CORS_ORIGINS: http://localhost:3000
      # ── Rate limiting (in-process, per client IP) ────────────────────────
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      RATE_LIMIT_PUBLIC_MAX_REQUESTS: ${RATE_LIMIT_PUBLIC_MAX_REQUESTS:-120}
      RATE_LIMIT_PUBLIC_WINDOW_SECONDS: ${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:-60}
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
      # Defaults mirror app/config.py so a fresh clone comes up in stub mode
      # with nothing set. The keys are forwarded empty rather than omitted:
      # app.payments.validate_payment_settings() treats empty as missing, so
      # STRIPE_MODE=live without keys still dies at boot instead of silently
      # running the stub.
      STRIPE_MODE: ${STRIPE_MODE:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      # Browser redirect targets, so localhost is correct here (CLAUDE.md §6.3
      # governs container-to-container calls, not URLs handed to the user).
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/dashboard?pagamento=sucesso}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/dashboard?pagamento=cancelado}
      # Stub mode only (T10): browser-facing base URL of this backend, used to
      # build the walkable /checkout/stub/{id} page's URL. Same reasoning as
      # STRIPE_SUCCESS_URL/CANCEL_URL above — handed to the browser, so
      # localhost is correct here even inside docker-compose.
      STRIPE_STUB_CHECKOUT_BASE_URL: ${STRIPE_STUB_CHECKOUT_BASE_URL:-http://localhost:8000}
      # Same stub/live shape as Stripe above: stub (default) just logs the
      # email and requires nothing; live calls Resend and RESEND_API_KEY
      # becomes mandatory — app.email.validate_email_settings() dies at boot
      # without it rather than silently running the stub.
      EMAIL_MODE: ${EMAIL_MODE:-stub}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-EspaçoHora <no-reply@espacohora.pt>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # The image's ENTRYPOINT runs `alembic upgrade head` before handing off to
    # this command, so a fresh clone still comes up with a working schema in one
    # step. The app itself never creates tables — see backend/app/database.py.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — copy .env.example to .env}
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  pgdata:
