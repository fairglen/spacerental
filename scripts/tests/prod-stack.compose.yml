# Test-only overlay for docker-compose.prod.yml (E01): what a laptop or a CI
# runner needs to run the production stack without AWS — a throwaway
# Postgres where RDS would be, Caddy's ports remapped so nothing on the
# machine has to give up 80/443, and the backend's `.env` taken from the
# scratch file scripts/tests/prod-stack.sh writes (never the checkout's own
# `.env`). NEVER FOR A DEPLOYMENT. Used as:
#
#   docker compose -p spacerental-prod-local --env-file <scratch>/.env \
#     -f docker-compose.prod.yml -f scripts/tests/prod-stack.compose.yml up -d --build
services:
  db:
    # postgres:18-alpine, pinned by digest (Q53) — the same as the dev stack.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: spacerental
      POSTGRES_PASSWORD: spacerental
      POSTGRES_DB: spacerental
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacerental -d spacerental"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    env_file: !override
      - ${PROD_STACK_ENV_FILE:?PROD_STACK_ENV_FILE is the scratch .env the stack test writes}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    ports: !override
      - "${PROD_STACK_HTTP_PORT:-80}:80"
      - "${PROD_STACK_HTTPS_PORT:-443}:443"
      - "${PROD_STACK_HTTPS_PORT:-443}:443/udp"
